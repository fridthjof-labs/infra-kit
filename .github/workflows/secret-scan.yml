name: Secret scan
# Reusable. Consumers call it from their own secret-scan.yml, whose triggers
# decide the mode: the tree scan catches what a change introduces, the weekly
# history scan catches what was committed and later deleted. Everything runs
# against the caller's checkout, and gitleaks comes from the caller's
# mise.toml so its version is pinned where the rest of that repo's tools are.
#
# Deliberately unfiltered: a dependency audit only has to run when
# dependencies move, but a secret can land in any file.
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A history scan needs history; a tree scan does not care.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: gitleaks

      - name: Scan working tree
        if: github.event_name != 'schedule'
        run: gitleaks dir . --no-banner --redact --exit-code 1

      - name: Scan history
        if: github.event_name == 'schedule'
        run: gitleaks git . --no-banner --redact --exit-code 1
