name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install only the validators, without evaluating repository toolchain
      # configuration. Digests are from the upstream GitHub release assets.
      - name: Install pinned validators
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              actionlint_arch=amd64
              actionlint_sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              zizmor_arch=x86_64
              zizmor_sha=ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed
              ;;
            aarch64)
              actionlint_arch=arm64
              actionlint_sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
              zizmor_arch=aarch64
              zizmor_sha=018a024d6b6d09733b07f6ef42838d984c23ec04bc9b2acd55f7d67826aeafe5
              ;;
            *) echo 'Unsupported Linux architecture' >&2; exit 1 ;;
          esac
          tools=$(mktemp -d "$RUNNER_TEMP/workflow-tools.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_${actionlint_arch}.tar.gz" -o "$tools/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/zizmorcore/zizmor/releases/download/v1.30.0/zizmor-${zizmor_arch}-unknown-linux-gnu.tar.gz" -o "$tools/zizmor.tar.gz"
          echo "$actionlint_sha  $tools/actionlint.tar.gz" | sha256sum --check --status
          echo "$zizmor_sha  $tools/zizmor.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xzf "$tools/zizmor.tar.gz" -C "$tools" zizmor
          echo "$tools" >> "$GITHUB_PATH"
      - name: Validate workflow syntax and expressions
        run: actionlint -shellcheck= -pyflakes=
      - name: Check workflow security
        run: zizmor --offline --strict-collection --no-config --no-ignores --min-severity medium --min-confidence high .github

  check:
    name: check
    needs: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install sops, age and shellcheck
        env:
          SOPS_VERSION: 3.13.3
          # From the release's own sops-v3.13.3.checksums.txt. Pinned here so a
          # replaced download fails the job rather than running as this repo's
          # sops; bump both lines together.
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age shellcheck
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            -o sops
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm -f sops
      - run: make check
