name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install sops, age and shellcheck
        env:
          SOPS_VERSION: 3.13.3
          # From the release's own sops-v3.13.3.checksums.txt. Pinned here so a
          # replaced download fails the job rather than running as this repo's
          # sops; bump both lines together.
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age shellcheck
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            -o sops
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm -f sops
      - run: make check
