name: Workflow CI

on:
  workflow_call:
    inputs:
      runner:
        description: JSON Linux runner label or label array; only trusted callers may select shared runners
        type: string
        default: '"ubuntu-latest"'
      runner-labels:
        description: JSON array of additional self-hosted labels recognized by actionlint
        type: string
        default: '[]'

permissions:
  contents: read

jobs:
  validate:
    name: validate workflows
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install only the validators, without evaluating the caller's toolchain
      # configuration. Digests are from the upstream GitHub release assets.
      - name: Install pinned validators
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              actionlint_arch=amd64
              actionlint_sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              zizmor_arch=x86_64
              zizmor_sha=ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed
              ;;
            aarch64)
              actionlint_arch=arm64
              actionlint_sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
              zizmor_arch=aarch64
              zizmor_sha=018a024d6b6d09733b07f6ef42838d984c23ec04bc9b2acd55f7d67826aeafe5
              ;;
            *) echo 'Unsupported Linux architecture' >&2; exit 1 ;;
          esac
          tools=$(mktemp -d "$RUNNER_TEMP/workflow-tools.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_${actionlint_arch}.tar.gz" -o "$tools/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/zizmorcore/zizmor/releases/download/v1.30.0/zizmor-${zizmor_arch}-unknown-linux-gnu.tar.gz" -o "$tools/zizmor.tar.gz"
          echo "$actionlint_sha  $tools/actionlint.tar.gz" | sha256sum --check --status
          echo "$zizmor_sha  $tools/zizmor.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xzf "$tools/zizmor.tar.gz" -C "$tools" zizmor
          echo "$tools" >> "$GITHUB_PATH"
      - name: Validate workflow syntax and expressions
        shell: bash
        env:
          RUNNER_LABELS: ${{ inputs.runner-labels }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ['RUNNER_LABELS'])
          if not isinstance(labels, list) or not all(isinstance(label, str) for label in labels):
              raise SystemExit('runner-labels must be a JSON array of strings')
          with open(os.environ['RUNNER_TEMP'] + '/actionlint.json', 'w') as f:
              json.dump({'self-hosted-runner': {'labels': labels}}, f)
          PY
          # Shell and Python linting belong to the repository's language checks;
          # make this gate independent of which optional tools a host has.
          actionlint -config-file "$RUNNER_TEMP/actionlint.json" -shellcheck= -pyflakes=
      - name: Check workflow security
        run: zizmor --offline --strict-collection --no-config --no-ignores --min-severity medium --min-confidence high .github
